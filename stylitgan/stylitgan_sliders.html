<script>
  const num_images = 7;
  const num = num_images-1; // num images to 'turn on'

  function handleSliderInput(sliderElement) {
    sliderElement.addEventListener('input', () => {
      input_id = sliderElement.getAttribute('id')
      example_no = input_id[input_id.length - 1]

      const value = sliderElement.value / 100;
      let part = Math.floor(value / (1/num) );

      let opacity = num * (value % (part*(1/num))); // for that img only
      if (part==0) {
          opacity = value / (1/num);
      }
      img_use = part + 1; // img to turn on 

      for (let i = 0; i < num_images; i++) {
          elem_name = example_no + '_image' + i;
          let img = document.getElementById(elem_name);
          if (i < img_use) {
              img.style.opacity = 1;
          } else if (i==img_use) {
              img.style.opacity = opacity;
          } else {
              img.style.opacity = 0;
          }
      }
    });
  }

  handleSliderInput(document.getElementById('slider0'));
  handleSliderInput(document.getElementById('slider1'));
  handleSliderInput(document.getElementById('slider2'));
  handleSliderInput(document.getElementById('slider3'));
  handleSliderInput(document.getElementById('slider4'));
  handleSliderInput(document.getElementById('slider5'));
  handleSliderInput(document.getElementById('slider6'));
  handleSliderInput(document.getElementById('slider7'));
  handleSliderInput(document.getElementById('slider8'));

</script>
